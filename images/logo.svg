<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <style>:root {
      --outline-color: currentColor; 
      
      /* Berkeley Style Guide Palette */
      --color-right-leaf: #002676; /* Berkeley Blue */
      --color-left-leaf: #00B0DA;   /* Lawrence Light Blue */
      --color-center-leaf: #FDB515;  /* California Gold */
    }
    
    .logo-elements {
      stroke: var(--outline-color);
      stroke-width: 2; /* Maintained thin outline */
      stroke-linecap: round;
      stroke-linejoin: round;
    }</style>
 <g class="layer">
  <title>Layer 1</title>
  <g class="logo-elements" id="svg_1">
   <!-- Base Stem: Simple vertical line -->
   <path d="m50,92l0,-26" fill="none" id="svg_2"/>
   <!-- 
      SYMMETRIC ROTATIONAL LEAF FAN
      All three leaves share the exact same geometric path string:
      d="M 50 10 C 68 28, 68 50, 50 66 C 32 50, 32 28, 50 10 Z"
      
      They are dynamically rotated around their shared bottom pivot point at (50, 66).
    -->
   <!-- Left Leaf: Rotated counter-clockwise by 42 degrees around base (50,66) -->
   <path d="m26.17,24.04c18,18 18,40 0,56c-18,-16 -18,-38 0,-56z" fill="var(--color-left-leaf)" id="svg_3" transform="matrix(0.5 -0.866025 0.866025 0.5 -31.9851 48.6853)"/>
   <!-- Right Leaf: Rotated clockwise by 42 degrees around base (50,66) -->
   <path d="m73.49,24.36c18,18 18,40 0,56c-18,-16 -18,-38 0,-56z" fill="var(--color-right-leaf)" transform="rotate(60 73.4894 52.3617)" id="svg_4"/>
   <!-- Center Leaf: Unrotated (0 degrees), layered cleanly on top -->
   <path d="m50,10c18,18 18,40 0,56c-18,-16 -18,-38 0,-56z" fill="var(--color-center-leaf)" id="svg_5"/>
  </g>
 </g>
</svg>